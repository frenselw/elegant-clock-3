<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Clock</title>
    <style>
        /*
         * Copyright (c) 2025 Hang Wong
         * SPDX-License-Identifier: AGPL-3.0-or-later
         */
        :root {
            --bg-dark: #1C2533;
            --face-dark: #2C3E50;
            --text-dark: #EAEAEA;
            --hand-dark: #EAEAEA;
            --second-hand-dark: #FF4B5C;
            --pivot-dark: #FF4B5C;
            --btn-bg-dark: rgba(255, 255, 255, 0.1);
            --btn-icon-dark: #FFFFFF;

            --bg-light: #F0F0F0;
            --face-light: #FFFFFF;
            --text-light: #222222;
            --hand-light: #222222;
            --second-hand-light: #FF0000;
            --pivot-light: #FF0000;
            --btn-bg-light: rgba(0, 0, 0, 0.08);
            --btn-icon-light: #333333;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.5s;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        body.light-mode {
            background-color: var(--bg-light);
        }

        .clock-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .clock {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .analog-clock {
            position: relative;
            width: 80vmin;
            height: 80vmin;
            background-color: var(--face-dark);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            transition: background-color 0.5s;
            overflow: hidden;
        }
        .analog-clock::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 180deg, #FF4B5C, #FF9A56, #FFD166, #7AE582, #4B93FF, #BB4BFF, #FF4B5C);
            opacity: 0.6;
            filter: blur(1px);
            mask: radial-gradient(circle at center, transparent 0%, transparent 85%, black 86%, black 100%);
            -webkit-mask: radial-gradient(circle at center, transparent 0%, transparent 85%, black 86%, black 100%);
            pointer-events: none;
        }
        
        body.light-mode .analog-clock {
            background-color: var(--face-light);
        }
        
        .digital-clock {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4vmin;
            color: var(--text-dark);
        }
        
        body.light-mode .digital-clock {
            color: var(--text-light);
        }

        .main-time {
            font-size: 22vmin;
            font-weight: 700;
            font-family: 'Courier New', 'Consolas', monospace;
            letter-spacing: 1.2vmin;
            text-shadow: 0 0 4vmin var(--second-hand-dark), 0 0 8vmin rgba(255, 75, 92, 0.3);
            line-height: 1;
            transition: color 0.5s, text-shadow 0.5s;
        }

        body.light-mode .main-time {
            text-shadow: 0 0 3vmin rgba(255, 0, 0, 0.25), 0 0 6vmin rgba(255, 0, 0, 0.15);
        }

        body.clock-style-luxury .main-time {
            text-shadow: 0 0 4vmin #f5c664, 0 0 8vmin rgba(245, 198, 100, 0.3);
        }

        body.clock-style-minimal .main-time {
            text-shadow: 0 0 3vmin rgba(255,255,255,0.2);
        }

        body.clock-style-guofeng .main-time {
            text-shadow: 0 0 3vmin rgba(165, 115, 73, 0.3);
        }

        .sub-times {
            display: flex;
            gap: 4vmin;
            justify-content: center;
            flex-wrap: wrap;
        }

        .sub-time {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6vmin;
            padding: 1.5vmin 3vmin;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 1.2vmin;
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-width: 20vmin;
            backdrop-filter: blur(4px);
            transition: background 0.3s, border-color 0.3s;
        }

        .sub-time:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        body.light-mode .sub-time {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.08);
        }

        body.light-mode .sub-time:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        .sub-label {
            font-size: 1.8vmin;
            font-weight: 500;
            opacity: 0.5;
            letter-spacing: 0.4vmin;
            text-transform: uppercase;
        }

        .sub-value {
            font-size: 3.8vmin;
            font-weight: 600;
            font-family: 'Courier New', 'Consolas', monospace;
            letter-spacing: 0.4vmin;
            font-variant-numeric: tabular-nums;
        }

        .sub-offset {
            font-size: 1.4vmin;
            opacity: 0.35;
            font-family: 'Courier New', monospace;
        }

        .analog-clock::after {
            content: '';
            position: absolute;
            width: 2.5vmin;
            height: 2.5vmin;
            background: var(--pivot-dark);
            border-radius: 50%;
            z-index: 11;
        }

        body.light-mode .analog-clock::after {
            background: var(--pivot-light);
        }

        .tick {
            position: absolute;
            top: 2%;
            left: 50%;
            transform-origin: 50% 96%;
            width: 0.25vmin;
            height: 46%;
            pointer-events: none;
        }

        .tick::before {
            content: '';
            display: block;
            width: 100%;
            height: 1.2vmin;
            background: var(--text-dark);
            opacity: 0.35;
            border-radius: 1px;
            transition: background 0.5s, opacity 0.5s;
        }

        .tick.major::before {
            height: 2vmin;
            width: 0.45vmin;
            opacity: 0.6;
        }

        body.light-mode .tick::before {
            background: var(--text-light);
        }

        .number {
            position: absolute;
            font-size: 7vmin;
            font-weight: 500;
            color: var(--text-dark);
            transform: translate(-50%, -50%);
            transition: color 0.5s;
        }
        
        body.light-mode .number {
            color: var(--text-light);
        }
        
        .hand {
            position: absolute;
            bottom: 50%;
            transform-origin: bottom;
            border-radius: 10px;
        }

        .hour-hand, .minute-hand {
            background: var(--hand-dark);
            transition: background 0.5s;
        }
        .hour-hand { width: 1.8vmin; height: 25%; z-index: 8; }
        .minute-hand { width: 1.4vmin; height: 35%; z-index: 9; }
        
        body.light-mode .hour-hand,
        body.light-mode .minute-hand { background: var(--hand-light); }

        .second-hand {
            width: 0.5vmin; height: 40%;
            background-color: var(--second-hand-dark);
            box-shadow: 0 0 15px rgba(255, 75, 92, 0.3);
            z-index: 10;
            transition: background-color 0.5s ease, box-shadow 0.5s ease, transform 0.1s ease;
        }
        body.light-mode .second-hand {
            background-color: var(--second-hand-light);
        }

        .controls {
            position: fixed;
            top: 50%;
            right: 3vw;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
        }
        
        .controls.hidden {
            opacity: 0;
            visibility: hidden;
        }

        button {
            width: 50px;
            height: 50px;
            background: var(--btn-bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s ease, background-color 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        body.light-mode button {
            background: var(--btn-bg-light);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        button svg {
            width: 24px;
            height: 24px;
            fill: var(--btn-icon-dark);
            transition: fill 0.3s;
        }
        
        body.light-mode button svg {
            fill: var(--btn-icon-light);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: var(--face-dark);
            color: var(--text-dark);
            padding: 25px 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        body.light-mode .modal-content {
            background: var(--face-light);
            color: var(--text-light);
        }

        .modal-content h2 {
            margin-top: 0;
        }

        body.clock-style-luxury {
            background-color: #11081f;
        }
        body.clock-style-luxury .analog-clock {
            background: radial-gradient(circle at 30% 30%, #674d9e 0%, #231138 60%);
            box-shadow: 0 20px 50px rgba(116, 65, 178, 0.35);
        }
        body.clock-style-luxury .analog-clock::before {
            background: conic-gradient(from 180deg, #f5c664, #d28f7f, #a368c7, #f5c664);
            opacity: 0.5;
        }
        body.clock-style-luxury .hour-hand,
        body.clock-style-luxury .minute-hand {
            background: #f3d88d;
        }
        body.clock-style-luxury .number,
        body.clock-style-luxury .digital-clock {
            color: #f6e6b5;
        }
        body.clock-style-luxury .analog-clock::after {
            background: #ffd86a;
        }

        body.clock-style-minimal {
            background-color: #111418;
        }
        body.clock-style-minimal .analog-clock {
            background: #14171d;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        }
        body.clock-style-minimal .analog-clock::before {
            background: conic-gradient(from 180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05), rgba(255,255,255,0.08));
            opacity: 0.2;
        }
        body.clock-style-minimal .hour-hand,
        body.clock-style-minimal .minute-hand,
        body.clock-style-minimal .analog-clock::after {
            background: #eeeeee;
        }
        body.clock-style-minimal .number,
        body.clock-style-minimal .digital-clock {
            color: #d4d7dd;
        }

        body.clock-style-guofeng {
            background-color: #f6ead9;
        }
        body.clock-style-guofeng .analog-clock {
            background: #f8f0e2;
            box-shadow: 0 15px 35px rgba(108, 70, 42, 0.16);
        }
        body.clock-style-guofeng .analog-clock::before {
            background: conic-gradient(from 180deg, #c69f6e, #e9d4a5, #f7eddc, #c69f6e);
            opacity: 0.35;
        }
        body.clock-style-guofeng .hour-hand,
        body.clock-style-guofeng .minute-hand {
            background: #66422f;
        }
        body.clock-style-guofeng .number,
        body.clock-style-guofeng .digital-clock {
            color: #5b3b2a;
            font-family: 'Songti SC', serif;
        }
        body.clock-style-guofeng .analog-clock::after {
            background: #a57349;
        }

        .modal-content a {
            color: var(--second-hand-dark);
        }

        body.light-mode .modal-content a {
            color: var(--second-hand-light);
        }

        /* Timezone Modal Styles */
        #timezoneModal .modal-content {
            max-width: 420px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        #timezoneModal .modal-content h2 {
            margin-bottom: 10px;
            font-size: 1.4em;
        }

        .tz-search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: var(--text-dark);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 12px;
            transition: border-color 0.3s;
        }

        .tz-search-input:focus {
            border-color: var(--second-hand-dark);
        }

        body.light-mode .tz-search-input {
            background: rgba(0,0,0,0.05);
            color: var(--text-light);
            border-color: rgba(0,0,0,0.15);
        }

        .tz-list {
            flex: 1;
            overflow-y: auto;
            max-height: 50vh;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .tz-list::-webkit-scrollbar {
            width: 6px;
        }

        .tz-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .tz-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        body.light-mode .tz-list::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
        }

        .tz-item {
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tz-item:hover {
            background: rgba(255,255,255,0.1);
        }

        body.light-mode .tz-item:hover {
            background: rgba(0,0,0,0.06);
        }

        .tz-item.active {
            background: rgba(255, 75, 92, 0.2);
            border: 1px solid rgba(255, 75, 92, 0.4);
        }

        .tz-item .tz-name {
            font-weight: 500;
            font-size: 14px;
        }

        .tz-item .tz-time {
            font-size: 13px;
            opacity: 0.7;
            font-variant-numeric: tabular-nums;
        }

        .timezone-label {
            position: fixed;
            bottom: 3vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: var(--text-dark);
            opacity: 0.5;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: color 0.5s, opacity 0.3s;
            cursor: pointer;
            z-index: 50;
        }

        .timezone-label:hover {
            opacity: 0.8;
        }

        body.light-mode .timezone-label {
            color: var(--text-light);
        }

        /* Left Controls (Hand Shape) */
        .left-controls {
            position: fixed;
            top: 50%;
            left: 3vw;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
        }

        .left-controls.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Hand Shape Label */
        .hand-shape-label {
            position: fixed;
            bottom: 3vh;
            left: 3vw;
            font-size: 13px;
            color: var(--text-dark);
            opacity: 0.5;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: color 0.5s, opacity 0.3s;
            z-index: 50;
            pointer-events: none;
        }

        body.light-mode .hand-shape-label {
            color: var(--text-light);
        }

    </style>
</head>
<body>

    <div class="clock-container">
        <div class="clock analog-clock">
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
        </div>
        <div class="clock digital-clock">
            <div class="main-time" id="mainTime">00:00:00</div>
            <div class="sub-times">
                <div class="sub-time">
                    <span class="sub-label">東京</span>
                    <span class="sub-value" id="tokyoTime">00:00</span>
                    <span class="sub-offset" id="tokyoOffset">UTC+9</span>
                </div>
                <div class="sub-time">
                    <span class="sub-label">紐約</span>
                    <span class="sub-value" id="nycTime">00:00</span>
                    <span class="sub-offset" id="nycOffset">UTC-4</span>
                </div>
                <div class="sub-time">
                    <span class="sub-label">本地</span>
                    <span class="sub-value" id="localSubTime">00:00</span>
                    <span class="sub-offset" id="localSubOffset">UTC+8</span>
                </div>
            </div>
        </div>
    </div>

    <div class="left-controls" id="leftControls">
        <button id="handShapeBtn" title="指針形狀: 經典"></button>
    </div>
    <div class="hand-shape-label" id="handShapeLabel">經典</div>

    <div class="controls">
        <button id="toggleClockBtn" title="Toggle Clock"></button>
        <button id="timezoneBtn" title="Timezone"></button>
        <button id="fullscreenBtn" title="Toggle Fullscreen"></button>
        <button id="toggleModeBtn" title="Toggle Theme"></button>
        <button id="styleBtn" title="Change Style"></button>
        <button id="aboutBtn" title="About"></button>
    </div>

    <div class="timezone-label" id="timezoneLabel">UTC+8 · 本地时间</div>

    <div id="aboutModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Elegant Clock</h2>
            <p>Created by <strong>Hang Wong</strong></p>
            <p>
                This software is open-source, licensed under the 
                <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener noreferrer">GNU AGPLv3</a>.
            </p>
        </div>
    </div>

    <div id="timezoneModal" class="modal-overlay">
        <div class="modal-content">
            <h2>🌍 选择时区</h2>
            <input type="text" class="tz-search-input" id="tzSearch" placeholder="搜索城市或时区..." />
            <ul class="tz-list" id="tzList"></ul>
        </div>
    </div>


    <script>
        /*
         * Copyright (c) 2025 Hang Wong
         * SPDX-License-Identifier: AGPL-3.0-or-later
         */
        const digitalClock = document.querySelector('.digital-clock');
        const analogClock = document.querySelector('.analog-clock');
        const hourHand = document.querySelector('.hour-hand');
        const minuteHand = document.querySelector('.minute-hand');
        const secondHand = document.querySelector('.second-hand');
        const controls = document.querySelector('.controls');
        const toggleClockBtn = document.getElementById('toggleClockBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const toggleModeBtn = document.getElementById('toggleModeBtn');
        const styleBtn = document.getElementById('styleBtn');
        const aboutBtn = document.getElementById('aboutBtn');
        const aboutModal = document.getElementById('aboutModal');
        const timezoneBtn = document.getElementById('timezoneBtn');
        const timezoneModal = document.getElementById('timezoneModal');
        const tzSearch = document.getElementById('tzSearch');
        const tzList = document.getElementById('tzList');
        const timezoneLabel = document.getElementById('timezoneLabel');
        const handShapeBtn = document.getElementById('handShapeBtn');
        const leftControls = document.getElementById('leftControls');
        const handShapeLabel = document.getElementById('handShapeLabel');

        let isAnalog = false;
        let styleIndex = 0;
        let handShapeIndex = 0;
        const handShapeNames = ['經典', '菱形', '箭頭'];
        const clockStyles = ['default', 'luxury', 'minimal', 'guofeng'];
        let selectedTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Shanghai';
        const systemTimezone = selectedTimezone;

        const icons = {
            analog: `<svg viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path><path d="M13 7h-2v5.414l3.293 3.293 1.414-1.414L13 11.586z"></path></svg>`,
            digital: `<svg viewBox="0 0 24 24"><path d="M7 10h2v4H7zm4 0h2v4h-2zm4 0h2v4h-2z"></path><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path></svg>`,
            fullscreenEnter: `<svg viewBox="0 0 24 24"><path d="M5 5h5V3H3v7h2zm5 14H5v-5H3v7h7zm9-14h-5V3h7v7h-2zm-5 14h5v-5h2v7h-7z"></path></svg>`,
            style: `<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10c0-5.523-4.477-10-10-10zm4.5 12.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-9 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm4.5-7a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"></path></svg>`,
            fullscreenExit: `<svg viewBox="0 0 24 24"><path d="M3 9h2V5h4V3H3zm16 0h2V5h-4V3h6v6zM9 21h2v-4h4v-2H9zm12-6h-2v4h-4v2h6z"></path></svg>`,
            sun: `<svg viewBox="0 0 24 24"><path d="M12 2c5.514 0 10 4.486 10 10s-4.486 10-10 10S2 17.514 2 12 6.486 2 12 2zM4 12c0 1.846.634 3.543 1.688 4.898l8.414-8.414A7.962 7.962 0 0 0 12 4c-4.411 0-8 3.589-8 8zm8 8c1.846 0 3.543-.634 4.898-1.688l-8.414-8.414A7.962 7.962 0 0 0 4 12c0 4.411 3.589 8 8 8z"></path></svg>`,
            moon: `<svg viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 1 8-8 8.009 8.009 0 0 1-8 8zm0-18A10 10 0 1 0 22 12 10 10 0 0 0 12 2z"></path></svg>`,
            info: `<svg viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path><path d="M11 11h2v6h-2zm0-4h2v2h-2z"></path></svg>`,
            globe: `<svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm6.918 6h-3.215a14.9 14.9 0 0 0-1.247-3.668A8.015 8.015 0 0 1 18.918 8zM12 4.04c.702.992 1.268 2.12 1.66 3.34H10.34A13.87 13.87 0 0 1 12 4.04zM4.26 14a7.9 7.9 0 0 1 0-4h3.692a16.4 16.4 0 0 0 0 4H4.26zm.822 2h3.215a14.9 14.9 0 0 0 1.247 3.668A8.015 8.015 0 0 1 5.082 16zm3.215-8H5.082a8.015 8.015 0 0 1 4.462-3.668A14.9 14.9 0 0 0 8.297 8zM12 19.96a13.87 13.87 0 0 1-1.66-3.34h3.32A13.87 13.87 0 0 1 12 19.96zM14.293 14H9.707a14.4 14.4 0 0 1 0-4h4.586a14.4 14.4 0 0 1 0 4zm.493 5.668A14.9 14.9 0 0 0 16.033 16h3.215a8.015 8.015 0 0 1-4.462 3.668zM19.768 14h-3.692a16.4 16.4 0 0 0 0-4h3.692a7.9 7.9 0 0 1 0 4z"></path></svg>`,
            handShape: `<svg viewBox="0 0 24 24"><path d="M12 2L2 9.5l3.8 11.5h12.4L22 9.5 12 2z"></path></svg>`
        };
        
        function updateSubTime(timeElId, offsetElId, tz) {
            const now = new Date();
            const timeStr = new Intl.DateTimeFormat('en', {
                timeZone: tz,
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).format(now);
            document.getElementById(timeElId).textContent = timeStr;

            const formatter = new Intl.DateTimeFormat('en', {
                timeZone: tz,
                timeZoneName: 'shortOffset'
            });
            const parts = formatter.formatToParts(now);
            const tzPart = parts.find(p => p.type === 'timeZoneName');
            document.getElementById(offsetElId).textContent = tzPart ? tzPart.value : '';
        }

        function setDate() {
            const now = new Date();
            const tzOptions = { timeZone: selectedTimezone };

            const seconds = parseInt(new Intl.DateTimeFormat('en', { ...tzOptions, second: 'numeric' }).format(now));
            const minutes = parseInt(new Intl.DateTimeFormat('en', { ...tzOptions, minute: 'numeric' }).format(now));
            const hours = parseInt(new Intl.DateTimeFormat('en', { ...tzOptions, hour: 'numeric', hour12: false }).format(now));

            const secondsDegrees = (seconds / 60) * 360;
            secondHand.style.transform = `rotate(${secondsDegrees}deg)`;
            secondHand.style.backgroundColor = getSecondHandColor(seconds);
            secondHand.style.boxShadow = `0 0 15px ${getSecondHandGlow(seconds)}`;
            const minutesDegrees = (minutes / 60) * 360 + (seconds/60)*6;
            minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;
            const hoursDegrees = (hours / 12) * 360 + (minutes/60)*30;
            hourHand.style.transform = `rotate(${hoursDegrees}deg)`;

            document.getElementById('mainTime').textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            // Update fixed sub-timezone displays
            updateSubTime('tokyoTime', 'tokyoOffset', 'Asia/Tokyo');
            updateSubTime('nycTime', 'nycOffset', 'America/New_York');
            updateSubTime('localSubTime', 'localSubOffset', systemTimezone);
        }

        function getSecondHandColor(seconds) {
            const hue = (seconds / 60) * 360;
            return `hsl(${hue}, 92%, 60%)`;
        }

        function getSecondHandGlow(seconds) {
            const hue = (seconds / 60) * 360;
            return `hsla(${hue}, 92%, 60%, 0.35)`;
        }

        function toggleClocks() {
            isAnalog = !isAnalog;
            analogClock.style.display = isAnalog ? 'flex' : 'none';
            digitalClock.style.display = isAnalog ? 'none' : 'flex';
            toggleClockBtn.innerHTML = isAnalog ? icons.digital : icons.analog;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Could not enter full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
        
        function handleFullscreenChange() {
            const isFullscreen = !!document.fullscreenElement;
            controls.classList.toggle('hidden', isFullscreen);
            leftControls.classList.toggle('hidden', isFullscreen);
            fullscreenBtn.innerHTML = isFullscreen ? icons.fullscreenExit : icons.fullscreenEnter;
        }

        function toggleMode() {
            document.body.classList.toggle('light-mode');
            const isLightMode = document.body.classList.contains('light-mode');
            toggleModeBtn.innerHTML = isLightMode ? icons.moon : icons.sun;
        }

        function createClockFace() {
            const radius = 42;
            // Create 60 tick marks
            for (let i = 0; i < 60; i++) {
                const tick = document.createElement('div');
                tick.className = i % 5 === 0 ? 'tick major' : 'tick';
                tick.style.transform = `translateX(-50%) rotate(${i * 6}deg)`;
                analogClock.appendChild(tick);
            }
            for (let i = 1; i <= 12; i++) {
                const angle = i * 30 * (Math.PI / 180);
                const number = document.createElement('div');
                number.className = 'number';
                number.textContent = i;
                number.style.left = `${50 + radius * Math.sin(angle)}%`;
                number.style.top = `${50 - radius * Math.cos(angle)}%`;
                analogClock.appendChild(number);
            }
        }

        function cycleClockStyle() {
            const previousStyle = clockStyles[styleIndex];
            document.body.classList.remove(`clock-style-${previousStyle}`);
            styleIndex = (styleIndex + 1) % clockStyles.length;
            const nextStyle = clockStyles[styleIndex];
            if (nextStyle !== 'default') {
                document.body.classList.add(`clock-style-${nextStyle}`);
            }
            styleBtn.title = `Style: ${nextStyle === 'default' ? 'Elegant' : nextStyle.charAt(0).toUpperCase() + nextStyle.slice(1)}`;
        }

        // ===== Hand Shape Definitions =====
        // Each shape defines: width, clipPath, borderRadius for each hand
        // null means "remove the inline style" (fall back to CSS default)
        const handShapeDefs = [
            // 0: Classic (default rounded bars)
            {
                hour:   { width: null, clipPath: null, borderRadius: null },
                minute: { width: null, clipPath: null, borderRadius: null },
                second: { width: null, clipPath: null, borderRadius: null }
            },
            // 1: Diamond (菱形) — pointed at both ends, widest in middle
            {
                hour:   { width: '2.2vmin', clipPath: 'polygon(50% 0%, 100% 45%, 50% 100%, 0% 45%)', borderRadius: '0' },
                minute: { width: '1.8vmin', clipPath: 'polygon(50% 0%, 100% 42%, 50% 100%, 0% 42%)', borderRadius: '0' },
                second: { width: '1vmin',   clipPath: 'polygon(50% 0%, 100% 38%, 50% 100%, 0% 38%)', borderRadius: '0' }
            },
            // 2: Arrow (箭頭) — sharp tip, wide arrowhead, narrow shaft
            {
                hour:   { width: '2.4vmin', clipPath: 'polygon(50% 0%, 75% 12%, 60% 22%, 60% 100%, 40% 100%, 40% 22%, 25% 12%)', borderRadius: '0' },
                minute: { width: '2vmin',   clipPath: 'polygon(50% 0%, 75% 10%, 62% 20%, 62% 100%, 38% 100%, 38% 20%, 25% 10%)', borderRadius: '0' },
                second: { width: '1.2vmin', clipPath: 'polygon(50% 0%, 80% 8%, 65% 16%, 65% 100%, 35% 100%, 35% 16%, 20% 8%)',   borderRadius: '0' }
            }
        ];

        function applyHandShape(index) {
            const def = handShapeDefs[index];
            const pairs = [
                { el: hourHand,   styles: def.hour },
                { el: minuteHand, styles: def.minute },
                { el: secondHand, styles: def.second }
            ];
            pairs.forEach(({ el, styles }) => {
                if (styles.width) {
                    el.style.width = styles.width;
                } else {
                    el.style.removeProperty('width');
                }
                if (styles.clipPath) {
                    el.style.clipPath = styles.clipPath;
                } else {
                    el.style.removeProperty('clip-path');
                }
                if (styles.borderRadius) {
                    el.style.borderRadius = styles.borderRadius;
                } else {
                    el.style.removeProperty('border-radius');
                }
            });
        }

        function cycleHandShape() {
            handShapeIndex = (handShapeIndex + 1) % handShapeNames.length;
            applyHandShape(handShapeIndex);
            handShapeBtn.title = `指針形狀: ${handShapeNames[handShapeIndex]}`;
            handShapeLabel.textContent = handShapeNames[handShapeIndex];
        }

        const timezones = [
            { id: 'Pacific/Midway',        label: '中途岛',           region: '太平洋' },
            { id: 'Pacific/Honolulu',      label: '夏威夷',           region: '太平洋' },
            { id: 'America/Anchorage',     label: '安克雷奇',         region: '北美洲' },
            { id: 'America/Los_Angeles',   label: '洛杉矶',           region: '北美洲' },
            { id: 'America/Denver',        label: '丹佛',             region: '北美洲' },
            { id: 'America/Chicago',       label: '芝加哥',           region: '北美洲' },
            { id: 'America/New_York',      label: '纽约',             region: '北美洲' },
            { id: 'America/Sao_Paulo',     label: '圣保罗',           region: '南美洲' },
            { id: 'America/Argentina/Buenos_Aires', label: '布宜诺斯艾利斯', region: '南美洲' },
            { id: 'Atlantic/South_Georgia', label: '南乔治亚',         region: '大西洋' },
            { id: 'Atlantic/Azores',       label: '亚速尔群岛',       region: '大西洋' },
            { id: 'Europe/London',         label: '伦敦',             region: '欧洲' },
            { id: 'Europe/Paris',          label: '巴黎',             region: '欧洲' },
            { id: 'Europe/Berlin',         label: '柏林',             region: '欧洲' },
            { id: 'Europe/Moscow',         label: '莫斯科',           region: '欧洲' },
            { id: 'Europe/Istanbul',       label: '伊斯坦布尔',       region: '欧洲' },
            { id: 'Africa/Cairo',          label: '开罗',             region: '非洲' },
            { id: 'Africa/Johannesburg',   label: '约翰内斯堡',       region: '非洲' },
            { id: 'Asia/Dubai',            label: '迪拜',             region: '亚洲' },
            { id: 'Asia/Kolkata',          label: '加尔各答',         region: '亚洲' },
            { id: 'Asia/Dhaka',            label: '达卡',             region: '亚洲' },
            { id: 'Asia/Bangkok',          label: '曼谷',             region: '亚洲' },
            { id: 'Asia/Shanghai',         label: '北京 / 上海',      region: '亚洲' },
            { id: 'Asia/Hong_Kong',        label: '香港',             region: '亚洲' },
            { id: 'Asia/Taipei',           label: '台北',             region: '亚洲' },
            { id: 'Asia/Singapore',        label: '新加坡',           region: '亚洲' },
            { id: 'Asia/Tokyo',            label: '东京',             region: '亚洲' },
            { id: 'Asia/Seoul',            label: '首尔',             region: '亚洲' },
            { id: 'Australia/Sydney',      label: '悉尼',             region: '大洋洲' },
            { id: 'Pacific/Auckland',      label: '奥克兰',           region: '大洋洲' },
        ];

        function getUtcOffset(tz) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en', {
                timeZone: tz,
                timeZoneName: 'shortOffset'
            });
            const parts = formatter.formatToParts(now);
            const tzPart = parts.find(p => p.type === 'timeZoneName');
            return tzPart ? tzPart.value : '';
        }

        function getCurrentTimeForTz(tz) {
            const now = new Date();
            return new Intl.DateTimeFormat('en', {
                timeZone: tz,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            }).format(now);
        }

        function updateTimezoneLabel() {
            const offset = getUtcOffset(selectedTimezone);
            const tz = timezones.find(t => t.id === selectedTimezone);
            const cityName = tz ? tz.label : selectedTimezone.split('/').pop().replace(/_/g, ' ');
            timezoneLabel.textContent = `${offset} · ${cityName}`;
        }

        function renderTimezoneList(filter = '') {
            tzList.innerHTML = '';
            const lowerFilter = filter.toLowerCase();
            const filtered = timezones.filter(tz =>
                tz.label.toLowerCase().includes(lowerFilter) ||
                tz.id.toLowerCase().includes(lowerFilter) ||
                tz.region.toLowerCase().includes(lowerFilter)
            );

            filtered.forEach(tz => {
                const li = document.createElement('li');
                li.className = 'tz-item' + (tz.id === selectedTimezone ? ' active' : '');
                li.innerHTML = `
                    <div>
                        <span class="tz-name">${tz.label}</span>
                        <br/>
                        <span style="font-size:12px;opacity:0.5">${tz.region} · ${getUtcOffset(tz.id)}</span>
                    </div>
                    <span class="tz-time">${getCurrentTimeForTz(tz.id)}</span>
                `;
                li.addEventListener('click', () => {
                    selectedTimezone = tz.id;
                    updateTimezoneLabel();
                    setDate();
                    renderTimezoneList(tzSearch.value);
                });
                tzList.appendChild(li);
            });
        }

        function init() {
            createClockFace();
            setInterval(setDate, 1000);
            setDate();
            
            toggleClockBtn.innerHTML = icons.analog;
            fullscreenBtn.innerHTML = icons.fullscreenEnter;
            toggleModeBtn.innerHTML = icons.sun;
            styleBtn.innerHTML = icons.style;
            aboutBtn.innerHTML = icons.info;
            timezoneBtn.innerHTML = icons.globe;
            handShapeBtn.innerHTML = icons.handShape;

            analogClock.style.display = 'none';
            digitalClock.style.display = 'flex';

            updateTimezoneLabel();

            toggleClockBtn.addEventListener('click', toggleClocks);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            toggleModeBtn.addEventListener('click', toggleMode);
            styleBtn.addEventListener('click', cycleClockStyle);
            handShapeBtn.addEventListener('click', cycleHandShape);
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            aboutBtn.addEventListener('click', () => { aboutModal.style.display = 'flex'; });
            aboutModal.addEventListener('click', (e) => {
                if (e.target === aboutModal) {
                    aboutModal.style.display = 'none';
                }
            });
            timezoneBtn.addEventListener('click', () => {
                renderTimezoneList(tzSearch.value);
                timezoneModal.style.display = 'flex';
                tzSearch.focus();
            });
            timezoneModal.addEventListener('click', (e) => {
                if (e.target === timezoneModal) {
                    timezoneModal.style.display = 'none';
                }
            });
            tzSearch.addEventListener('input', () => {
                renderTimezoneList(tzSearch.value);
            });
            timezoneLabel.addEventListener('click', () => {
                renderTimezoneList(tzSearch.value);
                timezoneModal.style.display = 'flex';
                tzSearch.focus();
            });
        }

        init();

    </script>
