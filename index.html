<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Clock</title>
    <style>
        /*
         * Copyright (c) 2025 Hang Wong
         * SPDX-License-Identifier: AGPL-3.0-or-later
         */
        :root {
            --bg-dark: #1C2533;
            --face-dark: #2C3E50;
            --text-dark: #EAEAEA;
            --hand-dark: #EAEAEA;
            --second-hand-dark: #FF4B5C;
            --pivot-dark: #FF4B5C;
            --btn-bg-dark: rgba(255, 255, 255, 0.1);
            --btn-icon-dark: #FFFFFF;

            --bg-light: #F0F0F0;
            --face-light: #FFFFFF;
            --text-light: #222222;
            --hand-light: #222222;
            --second-hand-light: #FF0000;
            --pivot-light: #FF0000;
            --btn-bg-light: rgba(0, 0, 0, 0.08);
            --btn-icon-light: #333333;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.5s;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        body.light-mode {
            background-color: var(--bg-light);
        }

        .clock-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .clock {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .analog-clock {
            position: relative;
            width: 80vmin;
            height: 80vmin;
            background-color: var(--face-dark);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            transition: background-color 0.5s;
            overflow: hidden;
        }
        .analog-clock::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 180deg, #FF4B5C, #FF9A56, #FFD166, #7AE582, #4B93FF, #BB4BFF, #FF4B5C);
            opacity: 0.6;
            filter: blur(1px);
            mask: radial-gradient(circle at center, transparent 0%, transparent 85%, black 86%, black 100%);
            -webkit-mask: radial-gradient(circle at center, transparent 0%, transparent 85%, black 86%, black 100%);
            pointer-events: none;
        }
        
        body.light-mode .analog-clock {
            background-color: var(--face-light);
        }
        
        .digital-clock {
            font-size: 25vmin;
            font-weight: 600;
            display: none;
            color: var(--text-dark);
        }
        
        body.light-mode .digital-clock {
            color: var(--text-light);
        }

        .analog-clock::after {
            content: '';
            position: absolute;
            width: 2.5vmin;
            height: 2.5vmin;
            background: var(--pivot-dark);
            border-radius: 50%;
            z-index: 11;
        }

        body.light-mode .analog-clock::after {
            background: var(--pivot-light);
        }

        .number {
            position: absolute;
            font-size: 7vmin;
            font-weight: 500;
            color: var(--text-dark);
            transform: translate(-50%, -50%);
            transition: color 0.5s;
        }
        
        body.light-mode .number {
            color: var(--text-light);
        }
        
        .hand {
            position: absolute;
            bottom: 50%;
            transform-origin: bottom;
            border-radius: 10px;
        }

        .hour-hand, .minute-hand {
            background: var(--hand-dark);
            transition: background 0.5s;
        }
        .hour-hand { width: 1.8vmin; height: 25%; z-index: 8; }
        .minute-hand { width: 1.4vmin; height: 35%; z-index: 9; }
        
        body.light-mode .hour-hand,
        body.light-mode .minute-hand { background: var(--hand-light); }

        .second-hand {
            width: 0.5vmin; height: 40%;
            background-color: var(--second-hand-dark);
            box-shadow: 0 0 15px rgba(255, 75, 92, 0.3);
            z-index: 10;
            transition: background-color 0.5s ease, box-shadow 0.5s ease, transform 0.1s ease;
        }
        body.light-mode .second-hand {
            background-color: var(--second-hand-light);
        }

        .controls {
            position: fixed;
            top: 50%;
            right: 3vw;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
        }
        
        .controls.hidden {
            opacity: 0;
            visibility: hidden;
        }

        button {
            width: 50px;
            height: 50px;
            background: var(--btn-bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s ease, background-color 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        body.light-mode button {
            background: var(--btn-bg-light);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        button svg {
            width: 24px;
            height: 24px;
            fill: var(--btn-icon-dark);
            transition: fill 0.3s;
        }
        
        body.light-mode button svg {
            fill: var(--btn-icon-light);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: var(--face-dark);
            color: var(--text-dark);
            padding: 25px 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        body.light-mode .modal-content {
            background: var(--face-light);
            color: var(--text-light);
        }

        .modal-content h2 {
            margin-top: 0;
        }

        body.clock-style-luxury {
            background-color: #11081f;
        }
        body.clock-style-luxury .analog-clock {
            background: radial-gradient(circle at 30% 30%, #674d9e 0%, #231138 60%);
            box-shadow: 0 20px 50px rgba(116, 65, 178, 0.35);
        }
        body.clock-style-luxury .analog-clock::before {
            background: conic-gradient(from 180deg, #f5c664, #d28f7f, #a368c7, #f5c664);
            opacity: 0.5;
        }
        body.clock-style-luxury .hour-hand,
        body.clock-style-luxury .minute-hand {
            background: #f3d88d;
        }
        body.clock-style-luxury .number,
        body.clock-style-luxury .digital-clock {
            color: #f6e6b5;
        }
        body.clock-style-luxury .analog-clock::after {
            background: #ffd86a;
        }

        body.clock-style-minimal {
            background-color: #111418;
        }
        body.clock-style-minimal .analog-clock {
            background: #14171d;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        }
        body.clock-style-minimal .analog-clock::before {
            background: conic-gradient(from 180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05), rgba(255,255,255,0.08));
            opacity: 0.2;
        }
        body.clock-style-minimal .hour-hand,
        body.clock-style-minimal .minute-hand,
        body.clock-style-minimal .analog-clock::after {
            background: #eeeeee;
        }
        body.clock-style-minimal .number,
        body.clock-style-minimal .digital-clock {
            color: #d4d7dd;
        }

        body.clock-style-guofeng {
            background-color: #f6ead9;
        }
        body.clock-style-guofeng .analog-clock {
            background: #f8f0e2;
            box-shadow: 0 15px 35px rgba(108, 70, 42, 0.16);
        }
        body.clock-style-guofeng .analog-clock::before {
            background: conic-gradient(from 180deg, #c69f6e, #e9d4a5, #f7eddc, #c69f6e);
            opacity: 0.35;
        }
        body.clock-style-guofeng .hour-hand,
        body.clock-style-guofeng .minute-hand {
            background: #66422f;
        }
        body.clock-style-guofeng .number,
        body.clock-style-guofeng .digital-clock {
            color: #5b3b2a;
            font-family: 'Songti SC', serif;
        }
        body.clock-style-guofeng .analog-clock::after {
            background: #a57349;
        }

        .modal-content a {
            color: var(--second-hand-dark);
        }

        body.light-mode .modal-content a {
            color: var(--second-hand-light);
        }

        /* Trail SVG */
        .trail-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .trail-svg .trail-glow {
            filter: blur(3px);
            opacity: 0.55;
        }
        .trail-svg .trail-core {
            filter: blur(0.4px);
        }

        /* Timezone display on clock face */
        .timezone-display {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2vmin;
            opacity: 0.5;
            white-space: nowrap;
            z-index: 2;
            color: var(--text-dark);
            transition: color 0.5s;
        }
        body.light-mode .timezone-display { color: var(--text-light); }
        body.clock-style-luxury .timezone-display { color: #f6e6b5; }
        body.clock-style-minimal .timezone-display { color: #d4d7dd; }
        body.clock-style-guofeng .timezone-display { color: #5b3b2a; }

        /* Timezone modal */
        .timezone-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .timezone-panel {
            background: var(--face-dark);
            color: var(--text-dark);
            padding: 25px 20px;
            border-radius: 15px;
            max-width: 380px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        body.light-mode .timezone-panel {
            background: var(--face-light);
            color: var(--text-light);
        }
        .timezone-panel h2 { margin-top: 0; text-align: center; margin-bottom: 15px; }
        .tz-item {
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tz-item:hover { background: rgba(128,128,128,0.2); }
        .tz-item.active { background: rgba(128,128,128,0.25); font-weight: 600; }
        .tz-name { font-size: 14px; }
        .tz-time { font-size: 13px; opacity: 0.5; font-variant-numeric: tabular-nums; }

    </style>
</head>
<body>

    <div class="clock-container">
        <div class="clock analog-clock">
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
            <div class="timezone-display" id="timezoneDisplay"></div>
        </div>
        <div class="clock digital-clock"></div>
    </div>

    <div class="controls">
        <button id="toggleClockBtn" title="Toggle Clock"></button>
        <button id="fullscreenBtn" title="Toggle Fullscreen"></button>
        <button id="toggleModeBtn" title="Toggle Theme"></button>
        <button id="styleBtn" title="Change Style"></button>
        <button id="aboutBtn" title="About"></button>
        <button id="timezoneBtn" title="Change Timezone"></button>
    </div>

    <div id="aboutModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Elegant Clock</h2>
            <p>Created by <strong>Hang Wong</strong></p>
            <p>
                This software is open-source, licensed under the 
                <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener noreferrer">GNU AGPLv3</a>.
            </p>
        </div>
    </div>

    <div id="timezoneModal" class="timezone-overlay">
        <div class="timezone-panel">
            <h2>Select Timezone</h2>
            <div id="timezoneList"></div>
        </div>
    </div>

    <script>
        /*
         * Copyright (c) 2025 Hang Wong
         * SPDX-License-Identifier: AGPL-3.0-or-later
         */
        const digitalClock = document.querySelector('.digital-clock');
        const analogClock = document.querySelector('.analog-clock');
        const hourHand = document.querySelector('.hour-hand');
        const minuteHand = document.querySelector('.minute-hand');
        const secondHand = document.querySelector('.second-hand');
        const controls = document.querySelector('.controls');
        const toggleClockBtn = document.getElementById('toggleClockBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const toggleModeBtn = document.getElementById('toggleModeBtn');
        const styleBtn = document.getElementById('styleBtn');
        const aboutBtn = document.getElementById('aboutBtn');
        const aboutModal = document.getElementById('aboutModal');
        const timezoneBtn = document.getElementById('timezoneBtn');
        const timezoneModal = document.getElementById('timezoneModal');
        const timezoneDisplay = document.getElementById('timezoneDisplay');
        const timezoneList = document.getElementById('timezoneList');

        let isAnalog = true;
        let styleIndex = 0;
        let currentTimezone = null; // null = local time
        const clockStyles = ['default', 'luxury', 'minimal', 'guofeng'];

        const TRAIL_ARC_DEGREES = 90;
        const TRAIL_SEGMENTS = 30;
        const TRAIL_TIP_WIDTH = 1.4;
        let trailSvg = null;
        let trailPathGlow = null;
        let trailPathCore = null;
        let trailGradientGlow = null;
        let trailGradientCore = null;

        const timezones = [
            { label: 'Local Time', value: null },
            { label: 'UTC', value: 'UTC' },
            { label: 'Pacific Time (Los Angeles)', value: 'America/Los_Angeles' },
            { label: 'Mountain Time (Denver)', value: 'America/Denver' },
            { label: 'Central Time (Chicago)', value: 'America/Chicago' },
            { label: 'Eastern Time (New York)', value: 'America/New_York' },
            { label: 'Brasília Time', value: 'America/Sao_Paulo' },
            { label: 'GMT (London)', value: 'Europe/London' },
            { label: 'CET (Paris)', value: 'Europe/Paris' },
            { label: 'EET (Athens)', value: 'Europe/Athens' },
            { label: 'Moscow Time', value: 'Europe/Moscow' },
            { label: 'GST (Dubai)', value: 'Asia/Dubai' },
            { label: 'IST (Mumbai)', value: 'Asia/Kolkata' },
            { label: 'CST (Shanghai)', value: 'Asia/Shanghai' },
            { label: 'JST (Tokyo)', value: 'Asia/Tokyo' },
            { label: 'KST (Seoul)', value: 'Asia/Seoul' },
            { label: 'AEST (Sydney)', value: 'Australia/Sydney' },
            { label: 'NZST (Auckland)', value: 'Pacific/Auckland' },
        ];

        const icons = {
            analog: `<svg viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path><path d="M13 7h-2v5.414l3.293 3.293 1.414-1.414L13 11.586z"></path></svg>`,
            digital: `<svg viewBox="0 0 24 24"><path d="M7 10h2v4H7zm4 0h2v4h-2zm4 0h2v4h-2z"></path><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path></svg>`,
            fullscreenEnter: `<svg viewBox="0 0 24 24"><path d="M5 5h5V3H3v7h2zm5 14H5v-5H3v7h7zm9-14h-5V3h7v7h-2zm-5 14h5v-5h2v7h-7z"></path></svg>`,
            style: `<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10c0-5.523-4.477-10-10-10zm4.5 12.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-9 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm4.5-7a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"></path></svg>`,
            fullscreenExit: `<svg viewBox="0 0 24 24"><path d="M3 9h2V5h4V3H3zm16 0h2V5h-4V3h6v6zM9 21h2v-4h4v-2H9zm12-6h-2v4h-4v2h6z"></path></svg>`,
            sun: `<svg viewBox="0 0 24 24"><path d="M12 2c5.514 0 10 4.486 10 10s-4.486 10-10 10S2 17.514 2 12 6.486 2 12 2zM4 12c0 1.846.634 3.543 1.688 4.898l8.414-8.414A7.962 7.962 0 0 0 12 4c-4.411 0-8 3.589-8 8zm8 8c1.846 0 3.543-.634 4.898-1.688l-8.414-8.414A7.962 7.962 0 0 0 4 12c0 4.411 3.589 8 8 8z"></path></svg>`,
            moon: `<svg viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 1 8-8 8.009 8.009 0 0 1-8 8zm0-18A10 10 0 1 0 22 12 10 10 0 0 0 12 2z"></path></svg>`,
            info: `<svg viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"></path><path d="M11 11h2v6h-2zm0-4h2v2h-2z"></path></svg>`,
            globe: `<svg viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm7.931 9H16.9a12.1 12.1 0 0 0-1.6-4.6A8.025 8.025 0 0 1 19.931 11zM12 4.04c.9 1.1 1.6 2.4 2 3.96h-4c.4-1.56 1.1-2.86 2-3.96zM4.26 14a7.9 7.9 0 0 1 0-4h3.38a13.1 13.1 0 0 0 0 4H4.26zm.82 2h2.95a12.1 12.1 0 0 0 1.6 4.6A8.025 8.025 0 0 1 5.08 16zm2.95-8H5.08a8.025 8.025 0 0 1 4.55-4.6A12.1 12.1 0 0 0 8.03 8zM12 19.96c-.9-1.1-1.6-2.4-2-3.96h4c-.4 1.56-1.1 2.86-2 3.96zM14.34 14H9.66a11.1 11.1 0 0 1 0-4h4.68a11.1 11.1 0 0 1 0 4zm.39 6.6a12.1 12.1 0 0 0 1.6-4.6h2.95a8.025 8.025 0 0 1-4.55 4.6zm1.6-6.6a13.1 13.1 0 0 0 0-4h3.38a7.9 7.9 0 0 1 0 4h-3.38z"></path></svg>`
        };
        
        function setDate() {
            const now = new Date();
            let hours, minutes, seconds;

            if (currentTimezone) {
                const parts = new Intl.DateTimeFormat('en-GB', {
                    timeZone: currentTimezone,
                    hour: 'numeric', minute: 'numeric', second: 'numeric',
                    hour12: false
                }).formatToParts(now);
                hours = parseInt(parts.find(p => p.type === 'hour').value);
                minutes = parseInt(parts.find(p => p.type === 'minute').value);
                seconds = parseInt(parts.find(p => p.type === 'second').value);
            } else {
                hours = now.getHours();
                minutes = now.getMinutes();
                seconds = now.getSeconds();
            }

            const secondsDegrees = (seconds / 60) * 360;
            secondHand.style.transform = `rotate(${secondsDegrees}deg)`;
            secondHand.style.backgroundColor = getSecondHandColor(seconds);
            secondHand.style.boxShadow = `0 0 15px ${getSecondHandGlow(seconds)}`;
            const minutesDegrees = (minutes / 60) * 360 + (seconds/60)*6;
            minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;
            const hoursDegrees = (hours / 12) * 360 + (minutes/60)*30;
            hourHand.style.transform = `rotate(${hoursDegrees}deg)`;

            digitalClock.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            updateTrail(seconds);
            updateTimezoneDisplay();
        }

        function getSecondHandColor(seconds) {
            const hue = (seconds / 60) * 360;
            return `hsl(${hue}, 92%, 60%)`;
        }

        function getSecondHandGlow(seconds) {
            const hue = (seconds / 60) * 360;
            return `hsla(${hue}, 92%, 60%, 0.35)`;
        }

        function toggleClocks() {
            isAnalog = !isAnalog;
            analogClock.style.display = isAnalog ? 'flex' : 'none';
            digitalClock.style.display = isAnalog ? 'none' : 'flex';
            toggleClockBtn.innerHTML = isAnalog ? icons.digital : icons.analog;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Could not enter full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
        
        function handleFullscreenChange() {
            const isFullscreen = !!document.fullscreenElement;
            controls.classList.toggle('hidden', isFullscreen);
            fullscreenBtn.innerHTML = isFullscreen ? icons.fullscreenExit : icons.fullscreenEnter;
        }

        function toggleMode() {
            document.body.classList.toggle('light-mode');
            const isLightMode = document.body.classList.contains('light-mode');
            toggleModeBtn.innerHTML = isLightMode ? icons.moon : icons.sun;
        }

        function createClockFace() {
            const radius = 42; 
            for (let i = 1; i <= 12; i++) {
                const angle = i * 30 * (Math.PI / 180);
                const number = document.createElement('div');
                number.className = 'number';
                number.textContent = i;
                number.style.left = `${50 + radius * Math.sin(angle)}%`;
                number.style.top = `${50 - radius * Math.cos(angle)}%`;
                analogClock.appendChild(number);
            }
        }

        function cycleClockStyle() {
            const previousStyle = clockStyles[styleIndex];
            document.body.classList.remove(`clock-style-${previousStyle}`);
            styleIndex = (styleIndex + 1) % clockStyles.length;
            const nextStyle = clockStyles[styleIndex];
            if (nextStyle !== 'default') {
                document.body.classList.add(`clock-style-${nextStyle}`);
            }
            styleBtn.title = `Style: ${nextStyle === 'default' ? 'Elegant' : nextStyle.charAt(0).toUpperCase() + nextStyle.slice(1)}`;
        }

        function createTrailLine() {
            trailSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            trailSvg.setAttribute('class', 'trail-svg');
            trailSvg.setAttribute('viewBox', '0 0 100 100');

            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');

            // Gradient for glow layer
            trailGradientGlow = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
            trailGradientGlow.setAttribute('id', 'trailGradGlow');
            trailGradientGlow.setAttribute('gradientUnits', 'userSpaceOnUse');
            for (let i = 0; i <= 8; i++) {
                const stop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop.setAttribute('offset', `${(i / 8) * 100}%`);
                stop.setAttribute('stop-opacity', `${i / 8}`);
                trailGradientGlow.appendChild(stop);
            }
            defs.appendChild(trailGradientGlow);

            // Gradient for core layer
            trailGradientCore = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
            trailGradientCore.setAttribute('id', 'trailGradCore');
            trailGradientCore.setAttribute('gradientUnits', 'userSpaceOnUse');
            for (let i = 0; i <= 8; i++) {
                const stop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop.setAttribute('offset', `${(i / 8) * 100}%`);
                stop.setAttribute('stop-opacity', `${i / 8}`);
                trailGradientCore.appendChild(stop);
            }
            defs.appendChild(trailGradientCore);

            trailSvg.appendChild(defs);

            trailPathGlow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            trailPathGlow.setAttribute('class', 'trail-glow');
            trailPathGlow.setAttribute('fill', `url(#trailGradGlow)`);
            trailPathGlow.setAttribute('stroke', 'none');

            trailPathCore = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            trailPathCore.setAttribute('class', 'trail-core');
            trailPathCore.setAttribute('fill', `url(#trailGradCore)`);
            trailPathCore.setAttribute('stroke', 'none');

            trailSvg.appendChild(trailPathGlow);
            trailSvg.appendChild(trailPathCore);
            analogClock.appendChild(trailSvg);
        }

        function buildTaperedPath(cx, cy, radius, currentAngle, arcDeg, tipWidth, steps) {
            const outerPoints = [];
            const innerPoints = [];
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const angle = currentAngle - t * (arcDeg / 180) * Math.PI;
                const hw = tipWidth * 0.5 * Math.pow(1 - t, 1.4);
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                outerPoints.push({
                    x: cx + (radius + hw) * sin,
                    y: cy - (radius + hw) * cos
                });
                innerPoints.push({
                    x: cx + (radius - hw) * sin,
                    y: cy - (radius - hw) * cos
                });
            }
            let d = `M${outerPoints[0].x.toFixed(3)} ${outerPoints[0].y.toFixed(3)}`;
            for (let i = 1; i <= steps; i++) {
                d += ` L${outerPoints[i].x.toFixed(3)} ${outerPoints[i].y.toFixed(3)}`;
            }
            for (let i = steps; i >= 0; i--) {
                d += ` L${innerPoints[i].x.toFixed(3)} ${innerPoints[i].y.toFixed(3)}`;
            }
            d += 'Z';
            return d;
        }

        function updateTrail(seconds) {
            const radius = 38;
            const cx = 50, cy = 50;
            const currentAngle = (seconds / 60) * 2 * Math.PI;

            // Build tapered shapes
            const dGlow = buildTaperedPath(cx, cy, radius, currentAngle, TRAIL_ARC_DEGREES, TRAIL_TIP_WIDTH * 1.8, TRAIL_SEGMENTS);
            const dCore = buildTaperedPath(cx, cy, radius, currentAngle, TRAIL_ARC_DEGREES, TRAIL_TIP_WIDTH * 0.7, TRAIL_SEGMENTS);

            // Gradient geometry
            const tipX = cx + radius * Math.sin(currentAngle);
            const tipY = cy - radius * Math.cos(currentAngle);
            const tailAngle = currentAngle - (TRAIL_ARC_DEGREES / 180) * Math.PI;
            const tailX = cx + radius * Math.sin(tailAngle);
            const tailY = cy - radius * Math.cos(tailAngle);

            trailGradientGlow.setAttribute('x1', `${tailX}`);
            trailGradientGlow.setAttribute('y1', `${tailY}`);
            trailGradientGlow.setAttribute('x2', `${tipX}`);
            trailGradientGlow.setAttribute('y2', `${tipY}`);
            trailGradientCore.setAttribute('x1', `${tailX}`);
            trailGradientCore.setAttribute('y1', `${tailY}`);
            trailGradientCore.setAttribute('x2', `${tipX}`);
            trailGradientCore.setAttribute('y2', `${tipY}`);

            const hue = (seconds / 60) * 360;
            const stopsGlow = trailGradientGlow.querySelectorAll('stop');
            stopsGlow.forEach((stop, idx) => {
                const t = idx / (stopsGlow.length - 1);
                const segHue = ((hue - (1 - t) * (TRAIL_ARC_DEGREES / 360) * 360) % 360 + 360) % 360;
                stop.setAttribute('stop-color', `hsl(${segHue}, 90%, 55%)`);
            });
            const stopsCore = trailGradientCore.querySelectorAll('stop');
            stopsCore.forEach((stop, idx) => {
                const t = idx / (stopsCore.length - 1);
                const segHue = ((hue - (1 - t) * (TRAIL_ARC_DEGREES / 360) * 360) % 360 + 360) % 360;
                stop.setAttribute('stop-color', `hsl(${segHue}, 95%, 80%)`);
            });

            trailPathGlow.setAttribute('d', dGlow);
            trailPathCore.setAttribute('d', dCore);
        }

        function updateTimezoneDisplay() {
            if (currentTimezone) {
                const tz = timezones.find(t => t.value === currentTimezone);
                timezoneDisplay.textContent = tz ? tz.label.split('(')[0].trim() : currentTimezone;
            } else {
                timezoneDisplay.textContent = '';
            }
        }

        function openTimezoneModal() {
            timezoneModal.style.display = 'flex';
            renderTimezoneList();
        }

        function renderTimezoneList() {
            timezoneList.innerHTML = '';
            const now = new Date();
            timezones.forEach(tz => {
                const item = document.createElement('div');
                item.className = 'tz-item';
                const isActive = (tz.value === currentTimezone) || (!tz.value && !currentTimezone);
                if (isActive) item.classList.add('active');

                const nameSpan = document.createElement('span');
                nameSpan.className = 'tz-name';
                nameSpan.textContent = tz.label;

                const timeSpan = document.createElement('span');
                timeSpan.className = 'tz-time';
                if (tz.value) {
                    timeSpan.textContent = new Intl.DateTimeFormat('en-GB', {
                        timeZone: tz.value, hour: '2-digit', minute: '2-digit', hour12: false
                    }).format(now);
                } else {
                    timeSpan.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                }

                item.appendChild(nameSpan);
                item.appendChild(timeSpan);
                item.addEventListener('click', () => {
                    currentTimezone = tz.value;
                    timezoneModal.style.display = 'none';
                    setDate();
                });
                timezoneList.appendChild(item);
            });
        }

        function init() {
            createClockFace();
            createTrailLine();
            setInterval(setDate, 1000);
            setDate();
            
            toggleClockBtn.innerHTML = icons.digital;
            fullscreenBtn.innerHTML = icons.fullscreenEnter;
            toggleModeBtn.innerHTML = icons.sun;
            styleBtn.innerHTML = icons.style;
            aboutBtn.innerHTML = icons.info;
            timezoneBtn.innerHTML = icons.globe;

            analogClock.style.display = 'flex';
            digitalClock.style.display = 'none';

            toggleClockBtn.addEventListener('click', toggleClocks);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            toggleModeBtn.addEventListener('click', toggleMode);
            styleBtn.addEventListener('click', cycleClockStyle);
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            aboutBtn.addEventListener('click', () => { aboutModal.style.display = 'flex'; });
            aboutModal.addEventListener('click', (e) => {
                if (e.target === aboutModal) {
                    aboutModal.style.display = 'none';
                }
            });
            timezoneBtn.addEventListener('click', openTimezoneModal);
            timezoneModal.addEventListener('click', (e) => {
                if (e.target === timezoneModal) {
                    timezoneModal.style.display = 'none';
                }
            });
        }

        init();

    </script>
</body>
